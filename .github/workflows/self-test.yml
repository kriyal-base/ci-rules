name: self-test
#
# Permanent smoke test for this shared repo — not a one-off. Runs whenever
# ci-rules itself changes (push/PR) so a schema or behavior regression in
# quality-gate.yml (or the attestation pattern below) is caught here,
# before it breaks every org that calls this repo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  call-quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      workspace-path: '.'
      run-tests: false
      allowed-orgs: 'kriyal-base'
    secrets:
      CI_RULES_BOT_TOKEN: ${{ secrets.CI_RULES_BOT_TOKEN }}

  attest-probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - run: echo "probe artifact" > probe.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'probe.txt'
