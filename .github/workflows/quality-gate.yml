name: Quality Gate
on:
  workflow_call:
    inputs:
      workspace-path:
        required: false
        type: string
        default: '.'
      sibling-repo:
        required: false
        type: string
        default: ''
      sibling-org:
        required: false
        type: string
        default: ''
      run-fmt:
        required: false
        type: boolean
        default: true
      run-deny:
        required: false
        type: boolean
        default: true
      run-machete:
        required: false
        type: boolean
        default: true
      run-tests:
        required: false
        type: boolean
        default: true
      auto-fix:
        required: false
        type: boolean
        default: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "step1b test ok"
